<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Magnifier Glass</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }

        .image-container {
            position: relative;
        }

        #image {
            width: 100%;
            max-width: 800px;
            border: 1px solid #ddd;
        }

        .img-magnifier-glass {
            position: absolute;
            border: 3px solid #000;
            /* border-radius: 50%; */
            cursor: none;
            width: 150px;
            height: 150px;
            overflow: hidden;
            display: none;
            z-index: 10;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

<body>
    <div class="image-container">
        <img id="image" src="assets/img/peta.png" alt="Magnifiable Image">
        <div id="magnifier" class="img-magnifier-glass"></div>
    </div>
    <script>
        const magnifyImage = (imgID, magnifierID) => {
            const img = document.getElementById(imgID);
            const magnifier = document.getElementById(magnifierID);

            // Set initial properties
            const zoom = 2; // Magnification level
            const magnifierSize = magnifier.offsetWidth / 2;

            magnifier.style.display = 'block';

            // Move the magnifier glass
            const moveMagnifier = (e) => {
                e.preventDefault();

                const { left, top, width, height } = img.getBoundingClientRect();
                let x = e.pageX - left - window.pageXOffset;
                let y = e.pageY - top - window.pageYOffset;

                if (x > width || x < 0 || y > height || y < 0) {
                    magnifier.style.display = 'none';
                    return;
                } else {
                    magnifier.style.display = 'block';
                }

                x = Math.max(0, Math.min(x, width));
                y = Math.max(0, Math.min(y, height));

                // Position the magnifier glass
                magnifier.style.left = `${x - magnifierSize}px`;
                magnifier.style.top = `${y - magnifierSize}px`;

                // Display the magnified area
                magnifier.style.backgroundImage = `url('${img.src}')`;
                magnifier.style.backgroundSize = `${img.width * zoom}px ${img.height * zoom}px`;
                magnifier.style.backgroundPosition = `-${x * zoom - magnifierSize}px -${y * zoom - magnifierSize}px`;
            };

            img.addEventListener('mousemove', moveMagnifier);
            magnifier.addEventListener('mousemove', moveMagnifier);

            img.addEventListener('mouseleave', () => {
                magnifier.style.display = 'none';
            });
        };

        // Initialize the magnifier
        magnifyImage('image', 'magnifier');

    </script>
</body>

</html>
